trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: AzureCLI@2
  displayName: 'Validate Bicep template'
  inputs:
    azureSubscription: 'AzureLabConnectionKraan'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -euo pipefail
      az bicep build --file main.bicep

- task: AzureCLI@2
  displayName: 'Deploy Bicep on main only'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    azureSubscription: 'AzureLabConnectionKraan'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -euo pipefail
      # Do not include the complete Azure DevOps macro in inlineScript: the
      # pipeline substitutes it before Bash runs, even inside shell quotes.
      if [ -z "${VM_ADMIN_PASSWORD:-}" ] || { [ "${VM_ADMIN_PASSWORD:0:1}" = '$' ] && [ "${VM_ADMIN_PASSWORD:1:1}" = '(' ]; }; then
        echo 'Configure a secret Azure DevOps pipeline variable named vmAdminPassword before deploying.' >&2
        exit 1
      fi
      az deployment sub create --location 'westeurope' --template-file main.bicep --parameters vmAdminPassword="$VM_ADMIN_PASSWORD"
  env:
    VM_ADMIN_PASSWORD: $(vmAdminPassword)

schedules:
- cron: '0 2 * * *'
  displayName: 'Dagelijkse nachtelijke infrastructuur check'
  branches:
    include:
    - non-existent-branch-xyz # Intentional: schedule does not trigger automatically.
  always: true
